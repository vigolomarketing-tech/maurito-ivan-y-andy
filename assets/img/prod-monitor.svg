<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Monitor gamer">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111726"/><stop offset="1" stop-color="#0b0f1a"/>
</linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#2f6bff"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22e0a1"/>
</linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect width="800" height="600" rx="18" fill="url(#bg)"/>

<g opacity="0.10">
<line x1="0" y1="150" x2="800" y2="150" stroke="#2f6bff" stroke-width="1"/>
<line x1="0" y1="300" x2="800" y2="300" stroke="#8b5cf6" stroke-width="1"/>
<line x1="0" y1="450" x2="800" y2="450" stroke="#22e0a1" stroke-width="1"/>
</g>
<ellipse cx="400" cy="470" rx="260" ry="34" fill="#2f6bff" opacity="0.18" filter="url(#glow)"/>
<g transform="translate(190,140)">
<rect x="0" y="0" width="420" height="250" rx="14" fill="#0e1524" stroke="url(#neon)" stroke-width="3"/>
<rect x="18" y="18" width="384" height="200" rx="6" fill="#2f6bff" opacity="0.14"/>
<path d="M40 190 L120 120 L180 160 L260 70 L340 130 L380 100" stroke="url(#neon)" stroke-width="4" fill="none" stroke-linecap="round"/>
<rect x="180" y="250" width="60" height="40" fill="#0e1524"/>
<rect x="120" y="290" width="180" height="16" rx="8" fill="#16203a" stroke="#8b5cf6" stroke-width="1.5"/>
</g>

</svg>