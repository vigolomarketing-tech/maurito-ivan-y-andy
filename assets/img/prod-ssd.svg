<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Disco SSD">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111726"/><stop offset="1" stop-color="#0b0f1a"/>
</linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#2f6bff"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22e0a1"/>
</linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect width="800" height="600" rx="18" fill="url(#bg)"/>

<g opacity="0.10">
<line x1="0" y1="150" x2="800" y2="150" stroke="#2f6bff" stroke-width="1"/>
<line x1="0" y1="300" x2="800" y2="300" stroke="#8b5cf6" stroke-width="1"/>
<line x1="0" y1="450" x2="800" y2="450" stroke="#22e0a1" stroke-width="1"/>
</g>
<ellipse cx="400" cy="470" rx="260" ry="34" fill="#2f6bff" opacity="0.18" filter="url(#glow)"/>
<g transform="translate(240,200)">
<rect x="0" y="0" width="320" height="200" rx="16" fill="#0e1524" stroke="url(#neon)" stroke-width="2"/>
<rect x="0" y="0" width="320" height="200" rx="16" fill="url(#neon)" opacity="0.05"/>
<text x="160" y="120" font-family="Space Grotesk, Arial" font-size="46" font-weight="700" fill="url(#neon)" text-anchor="middle">SSD</text>
<rect x="40" y="40" width="60" height="18" rx="4" fill="#8b5cf6" opacity="0.7"/>
<circle cx="270" cy="50" r="10" fill="#22e0a1"/>
</g>

</svg>