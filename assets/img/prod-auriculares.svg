<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Auriculares gamer">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111726"/><stop offset="1" stop-color="#0b0f1a"/>
</linearGradient>
<linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#2f6bff"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22e0a1"/>
</linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
<feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect width="800" height="600" rx="18" fill="url(#bg)"/>

<g opacity="0.10">
<line x1="0" y1="150" x2="800" y2="150" stroke="#2f6bff" stroke-width="1"/>
<line x1="0" y1="300" x2="800" y2="300" stroke="#8b5cf6" stroke-width="1"/>
<line x1="0" y1="450" x2="800" y2="450" stroke="#22e0a1" stroke-width="1"/>
</g>
<ellipse cx="400" cy="470" rx="260" ry="34" fill="#2f6bff" opacity="0.18" filter="url(#glow)"/>
<g transform="translate(250,150)" fill="none">
<path d="M40 200 A160 160 0 0 1 360 200" stroke="url(#neon)" stroke-width="14" stroke-linecap="round"/>
<rect x="10" y="190" width="70" height="150" rx="26" fill="#0e1524" stroke="#8b5cf6" stroke-width="2"/>
<rect x="320" y="190" width="70" height="150" rx="26" fill="#0e1524" stroke="#2f6bff" stroke-width="2"/>
<circle cx="45" cy="265" r="20" fill="url(#neon)" opacity="0.7"/>
<circle cx="355" cy="265" r="20" fill="url(#neon)" opacity="0.7"/>
</g>

</svg>